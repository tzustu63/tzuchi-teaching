# Nginx 配置檔案 - 課程計劃生成器
# 位置：/etc/nginx/sites-available/course-planner
# 啟用方式：sudo ln -s /etc/nginx/sites-available/course-planner /etc/nginx/sites-enabled/

# 方案 1：使用子域名（推薦）
# 例如：http://course-planner.yourdomain.com
server {
    listen 80;
    server_name course-planner.yourdomain.com;  # 請替換為您的實際域名

    # 前端靜態檔案和 SPA 路由
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 後端 API 請求（前端 Nginx 會自動處理，這裡是備用）
    location ~ ^/(api|courses|prompts|upload|api-keys|course-plans|health|docs|openapi.json) {
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

